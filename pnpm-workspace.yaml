packages:
    - apps/*
    - packages/*
    - tools/*

catalog:
    '@types/node': ^24
    '@vitest/browser-playwright': ^4.1.9
    typescript: ^5
    vite: npm:@voidzero-dev/vite-plus-core@latest
    vite-plus: latest
    vitepress: ^1.6.4
    vitest: 4.1.9

catalogMode: prefer
overrides:
    vite: 'catalog:'
    vitest: 'catalog:'
peerDependencyRules:
    allowAny:
        - vite
        - vitest
    allowedVersions:
        vite: '*'
        vitest: '*'
