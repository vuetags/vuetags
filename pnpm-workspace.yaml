packages:
    - apps/*
    - packages/*
    - tools/*

catalog:
    '@types/node': ^26
    '@vitest/browser-playwright': ^4.1.9
    '@vitest/coverage-v8': ^4.1.9
    '@vitejs/plugin-vue': ^6.0.5
    oxc-minify: ^0.137.0
    typescript: ^6
    vite: npm:@voidzero-dev/vite-plus-core@latest
    vite-plus: 0.2.1
    vitepress: 2.0.0-alpha.17
    vitest: 4.1.9
    vue: ^3.5.38
    vue-tsc: ^3.3.5

catalogMode: prefer
overrides:
    vite: 'catalog:'
    vitest: 'catalog:'
peerDependencyRules:
    allowAny:
        - vite
        - vitest
    allowedVersions:
        vite: '*'
        vitest: '*'
