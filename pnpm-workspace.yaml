packages:
    - apps/*
    - packages/*
    - tools/*

catalog:
    '@types/node': ^24
    '@vitest/browser-playwright': ^4.1.9
    oxc-minify: ^0.137.0
    typescript: ^5
    vite: npm:@voidzero-dev/vite-plus-core@latest
    vite-plus: latest
    vitepress: 2.0.0-alpha.17
    vitest: 4.1.9

catalogMode: prefer
overrides:
    vite: 'catalog:'
    vitest: 'catalog:'
peerDependencyRules:
    allowAny:
        - vite
        - vitest
    allowedVersions:
        vite: '*'
        vitest: '*'
